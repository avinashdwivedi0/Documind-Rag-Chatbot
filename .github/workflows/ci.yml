name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  # ============================================================================
  # Code Quality & Linting
  # ============================================================================
  code-quality:
    name: Code Quality Checks
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Black formatter check
        run: black --check --diff backend/ frontend/ tests/
        continue-on-error: true

      - name: Run isort import sorting check
        run: isort --check-only --diff backend/ frontend/ tests/
        continue-on-error: true

      - name: Run Flake8 linter
        run: flake8 backend/ frontend/ tests/
        continue-on-error: true

  # ============================================================================
  # Unit Tests & Coverage
  # ============================================================================
  tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term-missing
        env:
          PYTEST_TIMEOUT: 300
        continue-on-error: false

  # ============================================================================
  # Evaluation Regression Tests
  # ============================================================================
  eval-regression:
    name: Evaluation Regression Check
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation regression check
        run: python scripts/ci_eval_regression.py
        continue-on-error: true

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security check
        run: bandit -r backend/ -ll --skip B101,B601
        continue-on-error: true

      - name: Run Safety dependency check
        run: safety check
        continue-on-error: true

  # ============================================================================
  # Summary / Status Check
  # ============================================================================
  status:
    name: CI Status
    runs-on: windows-latest
    needs: [tests, eval-regression]
    if: always()

    steps:
      - name: Check critical job status
        shell: bash
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "❌ Critical tests failed"
            exit 1
          else
            echo "✅ All critical checks passed"
          fi
