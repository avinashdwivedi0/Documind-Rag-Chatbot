# Pytest configuration file
# Place in project root alongside requirements.txt

[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests
norecursedirs = .git .tox dist build *.egg venv data .venv __pycache__

# Minimum Python version
minversion = 7.0

# Coverage options
addopts =
    # Show extra info during test run
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Stop after N failures
    --maxfail=5
    # Show slowest N tests
    --durations=10
    # Show percentage progress bar
    --tb=short
    # Strict markers (error on unknown markers)
    --strict-markers
    # Coverage reporting
    --cov=backend
    --cov-report=html:htmlcov
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-branch
    --cov-fail-under=20
    # Asyncio mode for async tests
    --asyncio-mode=auto

# Markers for test categorization
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (medium, may use I/O)
    e2e: End-to-end tests (slow, full system)
    slow: Tests that are slow to run
    smoke: Smoke tests (quick validation)
    regression: Regression tests
    security: Security-related tests
    performance: Performance tests
    requires_api: Tests that require external API
    requires_db: Tests that require database
    skipif_no_api_key: Skip if API key not available
    xfail: Tests expected to fail
    wip: Work in progress tests

# Asyncio configuration
asyncio_mode = auto

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Doctest options
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Options for filtering warnings
filterwarnings =
    # Ignore deprecation warnings from dependencies
    ignore::DeprecationWarning:pkg_resources
    # Strict warnings - treat as errors
    error
    # But allow some specific warnings
    ignore:pkg_resources is deprecated:DeprecationWarning
    ignore::PendingDeprecationWarning

# Console output
console_output_style = progress

# Test ordering (if pytest-ordering installed)
# addopts = -p no:cacheprovider  # Disable pytest cache

# Coverage configuration (alternative to setup.cfg)
[coverage:run]
branch = True
source = backend
omit =
    */tests/*
    */site-packages/*
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    class .*\(Protocol\):
    if sys.platform
    if platform.system
    if platform.version

precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
