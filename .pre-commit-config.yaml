# Pre-commit hooks configuration
# Install with: pre-commit install
# Manual run: pre-commit run --all-files

repos:
  # ============================================================================
  # Code Formatting
  # ============================================================================

  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=100']

  # isort - Import sorter
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ['--profile', 'black']

  # ============================================================================
  # Linting
  # ============================================================================

  # Flake8 - Style guide enforcement
  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args:
          - '--max-line-length=100'
          - '--extend-ignore=E203,W503,D100,D101,D102,D103,D104,D107'
          - '--exclude=.git,__pycache__,.venv,venv,./data/*,tests,./scripts'
        additional_dependencies:
          - flake8-docstrings

  # ============================================================================
  # Type Checking
  # ============================================================================

  # MyPy - Type hint checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.4.0
    hooks:
      - id: mypy
        args:
          - '--ignore-missing-imports'
          - '--no-implicit-optional'
        additional_dependencies:
          - 'types-requests'
          - 'types-PyYAML'
        exclude: 'tests/'

  # ============================================================================
  # Security
  # ============================================================================

  # Bandit - Security issue scanner
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ['-ll', '--skip', 'B101,B601']
        exclude: 'tests/|frontend/'

  # Detect secrets - Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: 'tests/|requirements.*\.txt'

  # ============================================================================
  # General Checks
  # ============================================================================

  # Pre-commit built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      # Identify files that would merge conflicts
      - id: check-merge-conflict

      # Check YAML syntax
      - id: check-yaml
        args: ['--unsafe']

      # Check JSON syntax
      - id: check-json

      # Check for large files
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Ensure files end with newline
      - id: end-of-file-fixer

      # Trim trailing whitespace
      - id: trailing-whitespace

      # Fix mixed line endings
      - id: mixed-line-ending
        args: ['--fix=lf']

      # Prevent commits to main/master
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

      # Check for debugger imports
      - id: debug-statements

      # Verify that .py files have valid Python syntax
      - id: check-ast

  # ============================================================================
  # Documentation
  # ============================================================================

  # Docstring coverage
  - repo: https://github.com/econchick/interrogate
    rev: 1.5.0
    hooks:
      - id: interrogate
        args: ['-vv', '-I', '--fail-under=0']
        exclude: '^tests/|^setup\.py|^scripts/'

# ============================================================================
# Configuration
# ============================================================================

# Minimum Python version
minimum_pre_commit_version: '2.15.0'

# Exclude these files/directories globally
exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    venv/|
    __pycache__/|
    \.pytest_cache/|
    \.mypy_cache/|
    dist/|
    build/|
    \.eggs/|
    \.env|
    \.env\.local|
    data/|
    node_modules/
  )

# How to fail
fail_fast: false
